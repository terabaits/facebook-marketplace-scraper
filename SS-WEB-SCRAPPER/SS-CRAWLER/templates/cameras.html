<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Listings - SS-Crawler Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #e74c3c 0%, #f39c12 100%);
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 10px;
        }
        
        h1 {
            text-align: center;
            font-size: 2rem;
        }
        
        nav a:hover {
            background: #e74c3c !important;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #252542;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }
        
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stats-card {
            background: #252542;
            padding: 20px;
            border-radius: 10px;
        }
        
        .stats-card h3 {
            margin-bottom: 15px;
            color: #f39c12;
        }
        
        .brand-item, .model-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .brand-item:last-child, .model-item:last-child {
            border-bottom: none;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        input, button, select {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
        }
        
        input {
            background: #252542;
            color: #eaeaea;
            flex: 1;
            min-width: 200px;
        }
        
        button {
            background: #e74c3c;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #c0392b;
        }
        
        button.flag-btn {
            background: #f39c12;
        }

        button.flag-btn:hover {
            background: #d68910;
        }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        select {
            background: #252542;
            color: #eaeaea;
        }
        
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .camera-card {
            background: #252542;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        
        .camera-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .camera-card.flagged {
            border: 2px solid #f39c12;
        }
        
        .camera-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .camera-icon {
            width: 60px;
            height: 60px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .camera-icon svg {
            width: 100%;
            height: 100%;
        }
        
        .camera-title {
            flex: 1;
        }
        
        .camera-title h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .camera-title .camera-model {
            font-size: 0.9rem;
            color: #888;
        }
        
        .camera-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .camera-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
            font-size: 0.85rem;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .detail-label {
            color: #888;
        }
        
        .detail-value {
            color: #eaeaea;
            font-weight: 500;
        }
        
        .confidence-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .confidence-high {
            background: #27ae60;
            color: white;
        }
        
        .confidence-medium {
            background: #f39c12;
            color: white;
        }
        
        .confidence-low {
            background: #e74c3c;
            color: white;
        }
        
        .camera-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .camera-actions button {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
        }
        
        .camera-actions a {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.85rem;
            transition: background 0.3s;
        }
        
        .camera-actions a:hover {
            background: #5568d3;
        }
        
        .lens-badge {
            display: inline-block;
            background: #34495e;
            color: #ecf0f1;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 5px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }
        
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
        }
        
        .modal-content {
            background: #252542;
            margin: 10% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            margin: 0;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #888;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #444;
            color: #eaeaea;
            border-radius: 5px;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📷 Camera Listings Dashboard</h1>
        </header>
        
        <nav style="background: #252542; padding: 15px; margin-bottom: 20px; border-radius: 10px; text-align: center;">
            <a href="/" style="color: #eaeaea; text-decoration: none; padding: 10px 20px; margin: 0 5px; border-radius: 5px; display: inline-block; transition: background 0.3s;">🏠 Home</a>
            <a href="/computers" style="color: #eaeaea; text-decoration: none; padding: 10px 20px; margin: 0 5px; border-radius: 5px; display: inline-block; transition: background 0.3s;">💻 Computers</a>
            <a href="/cameras" style="background: #e74c3c; color: #eaeaea; text-decoration: none; padding: 10px 20px; margin: 0 5px; border-radius: 5px; display: inline-block;">📷 Cameras</a>
        </nav>
        
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-value" id="totalListings">-</div>
                <div class="stat-label">Total Listings</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activeListings">-</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="matchedListings">-</div>
                <div class="stat-label">Matched</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="avgPrice">-</div>
                <div class="stat-label">Avg Price</div>
            </div>
        </div>
        
        <div class="stats-section">
            <div class="stats-card">
                <h3>📊 Camera Body Statistics by Brand</h3>
                <div id="brandStats"></div>
            </div>
            <div class="stats-card">
                <h3>📊 Lens Statistics</h3>
                <div id="lensStats"></div>
            </div>
        </div>
        
        <div class="stats-card" style="margin-bottom: 20px;">
            <h3>📷 Camera Models</h3>
            <div id="modelStats"></div>
        </div>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search cameras, brands, models...">
            <button onclick="searchCameras()">Search</button>
            <button onclick="loadCameras()">Refresh</button>
            <button onclick="showFlagged()">View Flagged</button>
        </div>
        
        <div class="filter-bar">
            <select id="brandFilter" onchange="filterCameras()">
                <option value="">All Brands</option>
            </select>
            <select id="confidenceFilter" onchange="filterCameras()">
                <option value="0">All Confidence</option>
                <option value="0.7" selected>≥70%</option>
                <option value="0.5">≥50%</option>
                <option value="0.9">≥90%</option>
            </select>
            <select id="sortBy" onchange="sortCameras()">
                <option value="date">Sort by Date</option>
                <option value="price_low">Price: Low to High</option>
                <option value="price_high">Price: High to Low</option>
                <option value="confidence">Confidence</option>
            </select>
        </div>
        
        <div id="cameraGrid" class="camera-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading camera listings...</p>
            </div>
        </div>
    </div>
    
    <!-- Flag Modal -->
    <div id="flagModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Flag Listing</h2>
                <button class="close-btn" onclick="closeFlagModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Flag Type</label>
                <select id="flagType">
                    <option value="incorrect_match">Incorrect Match</option>
                    <option value="missing_info">Missing Information</option>
                    <option value="spam">Spam/Fraud</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Comment</label>
                <textarea id="flagComment" placeholder="Describe the issue..."></textarea>
            </div>
            <button onclick="submitFlag()" style="width: 100%;">Submit Flag</button>
        </div>
    </div>
    
    <script>
        let allCameras = [];
        let currentListingId = null;
        let cameraIcons = {};
        
        // Camera brand icons (SVG)
        function getCameraIcon(brand, model) {
            const brandLower = (brand || '').toLowerCase();
            const modelLower = (model || '').toLowerCase();
            
            if (brandLower.includes('canon')) {
                return `<svg viewBox="0 0 100 100" fill="none" stroke="#e74c3c" stroke-width="2">
                    <rect x="10" y="25" width="80" height="55" rx="5" />
                    <circle cx="50" cy="52" r="20" fill="none" stroke="#e74c3c" />
                    <circle cx="50" cy="52" r="12" fill="none" stroke="#e74c3c" />
                    <rect x="30" y="15" width="40" height="10" rx="2" />
                    <circle cx="75" cy="35" r="5" fill="#e74c3c" />
                    <text x="50" y="85" text-anchor="middle" font-size="10" fill="#e74c3c">CANON</text>
                </svg>`;
            } else if (brandLower.includes('sony')) {
                return `<svg viewBox="0 0 100 100" fill="none" stroke="#3498db" stroke-width="2">
                    <rect x="10" y="25" width="80" height="55" rx="5" />
                    <circle cx="50" cy="52" r="20" fill="none" stroke="#3498db" />
                    <circle cx="50" cy="52" r="12" fill="none" stroke="#3498db" />
                    <rect x="35" y="15" width="30" height="10" rx="2" />
                    <path d="M25 40 L35 40 L30 50 Z" fill="#3498db" />
                    <text x="50" y="85" text-anchor="middle" font-size="10" fill="#3498db">SONY α</text>
                </svg>`;
            } else if (brandLower.includes('fuji')) {
                return `<svg viewBox="0 0 100 100" fill="none" stroke="#e67e22" stroke-width="2">
                    <rect x="10" y="25" width="80" height="55" rx="8" />
                    <circle cx="50" cy="52" r="20" fill="none" stroke="#e67e22" />
                    <circle cx="50" cy="52" r="12" fill="none" stroke="#e67e22" />
                    <rect x="38" y="15" width="24" height="10" rx="2" />
                    <text x="50" y="85" text-anchor="middle" font-size="10" fill="#e67e22">FUJIFILM</text>
                </svg>`;
            } else if (brandLower.includes('panasonic') || brandLower.includes('lumix')) {
                return `<svg viewBox="0 0 100 100" fill="none" stroke="#2ecc71" stroke-width="2">
                    <rect x="10" y="25" width="80" height="55" rx="3" />
                    <circle cx="50" cy="52" r="20" fill="none" stroke="#2ecc71" />
                    <circle cx="50" cy="52" r="12" fill="none" stroke="#2ecc71" />
                    <rect x="30" y="15" width="40" height="10" rx="2" />
                    <text x="50" y="85" text-anchor="middle" font-size="10" fill="#2ecc71">LUMIX</text>
                </svg>`;
            } else if (brandLower.includes('blackmagic')) {
                return `<svg viewBox="0 0 100 100" fill="none" stroke="#9b59b6" stroke-width="2">
                    <rect x="10" y="25" width="80" height="55" rx="2" />
                    <circle cx="50" cy="52" r="20" fill="none" stroke="#9b59b6" />
                    <circle cx="50" cy="52" r="12" fill="none" stroke="#9b59b6" />
                    <rect x="25" y="15" width="50" height="10" rx="2" />
                    <text x="50" y="85" text-anchor="middle" font-size="9" fill="#9b59b6">BLACKMAGIC</text>
                </svg>`;
            } else if (brandLower.includes('hasselblad')) {
                return `<svg viewBox="0 0 100 100" fill="none" stroke="#f1c40f" stroke-width="2">
                    <rect x="10" y="25" width="80" height="55" rx="4" />
                    <circle cx="50" cy="52" r="20" fill="none" stroke="#f1c40f" />
                    <circle cx="50" cy="52" r="12" fill="none" stroke="#f1c40f" />
                    <rect x="40" y="15" width="20" height="10" rx="2" />
                    <text x="50" y="85" text-anchor="middle" font-size="8" fill="#f1c40f">HASSELBLAD</text>
                </svg>`;
            } else {
                // Generic camera icon
                return `<svg viewBox="0 0 100 100" fill="none" stroke="#7f8c8d" stroke-width="2">
                    <rect x="10" y="25" width="80" height="55" rx="5" />
                    <circle cx="50" cy="52" r="20" fill="none" stroke="#7f8c8d" />
                    <circle cx="50" cy="52" r="12" fill="none" stroke="#7f8c8d" />
                    <rect x="35" y="15" width="30" height="10" rx="2" />
                    <circle cx="75" cy="35" r="5" fill="#7f8c8d" />
                </svg>`;
            }
        }
        
        function getConfidenceClass(confidence) {
            if (confidence >= 0.9) return 'confidence-high';
            if (confidence >= 0.7) return 'confidence-medium';
            return 'confidence-low';
        }
        
        function formatPrice(price) {
            return '€' + parseFloat(price).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }
        
        async function loadCameras() {
            try {
                const response = await fetch('/api/cameras?limit=100');
                const data = await response.json();
                
                if (data.success) {
                    allCameras = data.listings;
                    renderCameras(allCameras);
                    loadStats();
                }
            } catch (error) {
                console.error('Error loading cameras:', error);
                document.getElementById('cameraGrid').innerHTML = 
                    '<div class="no-results">Error loading camera listings</div>';
            }
        }
        
        async function loadStats() {
            try {
                const [cameraStats, lensStats] = await Promise.all([
                    fetch('/api/cameras/stats').then(r => r.json()),
                    fetch('/api/lenses/stats').then(r => r.json())
                ]);
                
                if (cameraStats.success) {
                    const stats = cameraStats.stats;
                    document.getElementById('totalListings').textContent = stats.total || 0;
                    document.getElementById('activeListings').textContent = stats.active || 0;
                    document.getElementById('matchedListings').textContent = stats.matched || 0;
                    document.getElementById('avgPrice').textContent = formatPrice(stats.avg_price || 0);
                    
                    // Brand stats
                    const brandContainer = document.getElementById('brandStats');
                    brandContainer.innerHTML = stats.brands.map(b => `
                        <div class="brand-item">
                            <span>${b.brand}</span>
                            <span>${b.count} listings (avg ${formatPrice(b.avg_price)})</span>
                        </div>
                    `).join('');
                    
                    // Model stats
                    const modelContainer = document.getElementById('modelStats');
                    modelContainer.innerHTML = stats.models.slice(0, 10).map(m => `
                        <div class="model-item">
                            <span>${m.brand} ${m.model}</span>
                            <span>${m.count} listings</span>
                        </div>
                    `).join('');
                    
                    // Update brand filter
                    const brandFilter = document.getElementById('brandFilter');
                    const uniqueBrands = [...new Set(stats.brands.map(b => b.brand))];
                    brandFilter.innerHTML = '<option value="">All Brands</option>' + 
                        uniqueBrands.map(b => `<option value="${b}">${b}</option>`).join('');
                }
                
                if (lensStats.success) {
                    const stats = lensStats.lens_stats;
                    document.getElementById('lensStats').innerHTML = `
                        <div class="brand-item">
                            <span>Total Lens Listings</span>
                            <span>${stats.total}</span>
                        </div>
                        <div class="brand-item">
                            <span>Average Lens Price</span>
                            <span>${formatPrice(stats.avg_price)}</span>
                        </div>
                        <div class="brand-item">
                            <span>Price Range</span>
                            <span>${formatPrice(stats.min_price)} - ${formatPrice(stats.max_price)}</span>
                        </div>
                        ${stats.brands.slice(0, 5).map(b => `
                            <div class="brand-item">
                                <span>${b.brand}</span>
                                <span>${b.count} lenses (avg ${formatPrice(b.avg_price)})</span>
                            </div>
                        `).join('')}
                    `;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        function renderCameras(cameras) {
            const grid = document.getElementById('cameraGrid');
            
            if (cameras.length === 0) {
                grid.innerHTML = '<div class="no-results">No camera listings found</div>';
                return;
            }
            
            grid.innerHTML = cameras.map(camera => `
                <div class="camera-card" data-id="${camera.listing_id}">
                    <div class="camera-header">
                        <div class="camera-icon">
                            ${getCameraIcon(camera.camera_brand, camera.camera_model)}
                        </div>
                        <div class="camera-title">
                            <h3>${camera.title.substring(0, 60)}${camera.title.length > 60 ? '...' : ''}</h3>
                            <div class="camera-model">
                                ${camera.camera_brand ? `${camera.camera_brand} ${camera.camera_model}` : 'Unknown Model'}
                            </div>
                        </div>
                        <div class="camera-price">${formatPrice(camera.price_eur)}</div>
                    </div>
                    
                    <div class="camera-details">
                        <div class="detail-item">
                            <span class="detail-label">Mount:</span>
                            <span class="detail-value">${camera.mount || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Sensor:</span>
                            <span class="detail-value">${camera.sensor || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Type:</span>
                            <span class="detail-value">${camera.camera_type || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Location:</span>
                            <span class="detail-value">${camera.seller_location || 'N/A'}</span>
                        </div>
                    </div>
                    
                    <div>
                        <span class="confidence-badge ${getConfidenceClass(camera.camera_confidence_score || 0)}">
                            ${Math.round((camera.camera_confidence_score || 0) * 100)}% match
                        </span>
                        ${camera.description && camera.description.includes('Lenses detected') ? 
                            '<span class="lens-badge">📷 Lens included</span>' : ''}
                    </div>
                    
                    <div class="camera-actions">
                        <a href="${camera.listing_url}" target="_blank">View on ss.com</a>
                        <button class="flag-btn" onclick="openFlagModal('${camera.listing_id}')">Flag</button>
                    </div>
                </div>
            `).join('');
        }
        
        function filterCameras() {
            const brandFilter = document.getElementById('brandFilter').value;
            const confidenceFilter = parseFloat(document.getElementById('confidenceFilter').value);
            
            let filtered = allCameras;
            
            if (brandFilter) {
                filtered = filtered.filter(c => c.camera_brand === brandFilter);
            }
            
            if (confidenceFilter > 0) {
                filtered = filtered.filter(c => (c.camera_confidence_score || 0) >= confidenceFilter);
            }
            
            sortCameras(filtered);
        }
        
        function sortCameras(cameras = allCameras) {
            const sortBy = document.getElementById('sortBy').value;
            let sorted = [...cameras];
            
            switch (sortBy) {
                case 'price_low':
                    sorted.sort((a, b) => a.price_eur - b.price_eur);
                    break;
                case 'price_high':
                    sorted.sort((a, b) => b.price_eur - a.price_eur);
                    break;
                case 'confidence':
                    sorted.sort((a, b) => (b.camera_confidence_score || 0) - (a.camera_confidence_score || 0));
                    break;
                default:
                    sorted.sort((a, b) => new Date(b.date_posted) - new Date(a.date_posted));
            }
            
            renderCameras(sorted);
        }
        
        async function searchCameras() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                loadCameras();
                return;
            }
            
            try {
                const response = await fetch(`/api/cameras/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.success) {
                    renderCameras(data.listings);
                }
            } catch (error) {
                console.error('Error searching cameras:', error);
            }
        }
        
        function openFlagModal(listingId) {
            currentListingId = listingId;
            document.getElementById('flagModal').style.display = 'block';
        }
        
        function closeFlagModal() {
            document.getElementById('flagModal').style.display = 'none';
            currentListingId = null;
        }
        
        async function submitFlag() {
            if (!currentListingId) return;
            
            const flagType = document.getElementById('flagType').value;
            const comment = document.getElementById('flagComment').value;
            
            try {
                const response = await fetch(`/api/cameras/${currentListingId}/flag`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ flag_type: flagType, comment: comment })
                });
                
                const data = await response.json();
                if (data.success) {
                    closeFlagModal();
                    alert('Listing flagged successfully');
                }
            } catch (error) {
                console.error('Error flagging listing:', error);
            }
        }
        
        async function showFlagged() {
            try {
                const response = await fetch('/api/cameras/flagged');
                const data = await response.json();
                
                if (data.success) {
                    renderCameras(data.listings);
                }
            } catch (error) {
                console.error('Error loading flagged cameras:', error);
            }
        }
        
        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('flagModal');
            if (event.target === modal) {
                closeFlagModal();
            }
        }
        
        // Load cameras on page load
        loadCameras();
        
        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchCameras();
            }
        });
    </script>
</body>
</html>
