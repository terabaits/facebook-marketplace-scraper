{% extends "base.html" %}

{% block title %}Camera Listings - SS-Crawler{% endblock %}

{% block content %}
<div class="section">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
        <h2>📸 Camera Listings</h2>
        <div class="filters" style="margin: 0;">
            <label>
                <input type="checkbox" id="active-only" checked onchange="loadCameras()">
                Active only
            </label>
            <label>
                Sort:
                <select id="sort-by" onchange="loadCameras()">
                    <option value="date_posted">{{ t('Date Posted') }}</option>
                    <option value="price">{{ t('Price') }}</option>
                </select>
            </label>
            <label>
                Order:
                <select id="sort-order" onchange="loadCameras()">
                    <option value="desc">{{ t('Descending') }}</option>
                    <option value="asc">{{ t('Ascending') }}</option>
                </select>
            </label>
            <label>
                Brand:
                <select id="brand-filter" onchange="loadCameras()">
                    <option value="">All Brands</option>
                </select>
            </label>
            <label>
                Model:
                <select id="model-filter" onchange="loadCameras()">
                    <option value="">All Models</option>
                </select>
            </label>
            <label>
                Sensor:
                <select id="sensor-filter" onchange="loadCameras()">
                    <option value="">All Sensors</option>
                </select>
            </label>
        </div>
    </div>
    
    <!-- Stats Panel -->
    <div class="stats-grid" style="margin-bottom: 2rem;">
        <div class="stat-card">
            <h3>{{ t('Total Listings') }}</h3>
            <div class="stat-value" id="stat-total">-</div>
        </div>
        <div class="stat-card">
            <h3>Active Listings</h3>
            <div class="stat-value" id="stat-active">-</div>
        </div>
        <div class="stat-card">
            <h3>{{ t('Avg Price') }}</h3>
            <div class="stat-value" id="stat-avg-price">-</div>
        </div>
        <div class="stat-card">
            <h3>With Lens Detected</h3>
            <div class="stat-value" id="stat-with-lens">-</div>
        </div>
    </div>
    
    <!-- Camera Listings Table -->
    <div class="modern-panel" id="listings-container">
        <div class="loading">Loading camera listings...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Camera brands, models and sensors data
let cameraBrands = [];
let cameraModels = [];
let sensorTypes = ['Full Frame', 'APS-C', 'Micro 4/3', '1-inch', 'Medium Format'];

// Extract sensor type from camera title/model
function extractSensorType(title, model) {
    if (!title && !model) return 'Unknown';
    
    const text = (title + ' ' + model).toLowerCase();
    
    // Common sensor type patterns
    const sensorPatterns = [
        { pattern: /full.?frame|fx|eos.?6d|eos.?5d|a7r|a7s|a7iii|a7iv|d850|d750|z6|z7/i, type: 'Full Frame' },
        { pattern: /aps-?c|dx|ef-?s|eos.?rebel|eos.?80d|eos.?90d|d3500|d5600|a6/i, type: 'APS-C' },
        { pattern: /micro.?4\/3|m43|m4\/3|lumix.?g|olympus|panasonic/i, type: 'Micro 4/3' },
        { pattern: /1.?inch|rx100|rx10|zv-1/i, type: '1-inch' },
        { pattern: /medium.?format|645|gfx/i, type: 'Medium Format' }
    ];
    
    for (const { pattern, type } of sensorPatterns) {
        if (pattern.test(text)) return type;
    }
    
    // Try to extract from specific patterns like "Panasonic Modelis: Dmc-Fz18"
    if (/panasonic|lumix/i.test(text)) {
        // Panasonic bridge cameras typically have smaller sensors
        if (/fz|tz|zs|lx|gh|gf|gx|gm/i.test(text)) return 'Micro 4/3';
    }
    
    // Canon model extraction
    if (/canon/i.test(text)) {
        // Rebel/xxxD series are APS-C
        if (/rebel|600d|650d|700d|750d|760d|800d|850d|200d|250d/i.test(text)) return 'APS-C';
        // xD series with smaller numbers are APS-C, larger are Full Frame
        if (/70d|77d|80d|90d|7d|77d/i.test(text)) return 'APS-C';
        // 6D, 5D, R5, R6 are Full Frame
        if (/6d|5d|1dx|r5|r6|rp/i.test(text)) return 'Full Frame';
        // M series mirrorless are APS-C
        if (/eos.?m/i.test(text)) return 'APS-C';
    }
    
    // Nikon extraction
    if (/nikon/i.test(text)) {
        // D3xxx, D5xxx are APS-C
        if (/d3|d5/i.test(text)) return 'APS-C';
        // D7xxx are APS-C
        if (/d7/i.test(text)) return 'APS-C';
        // D6, D8 are Full Frame
        if (/d6|d8/i.test(text)) return 'Full Frame';
        // Z50, Zfc are APS-C
        if (/z50|zfc/i.test(text)) return 'APS-C';
    }
    
    // Sony extraction
    if (/sony/i.test(text)) {
        // A6xxx series are APS-C
        if (/a6/i.test(text)) return 'APS-C';
        // A7, A9, A1 are Full Frame
        if (/a7|a9|a1/i.test(text)) return 'Full Frame';
    }
    
    return 'Unknown';
}

// Load camera filters from API
async function loadCameraFilters() {
    try {
        const response = await fetch('/api/camera-brands');
        const brands = await response.json();
        
        const brandSelect = document.getElementById('brand-filter');
        if (brands && brands.length > 0) {
            cameraBrands = brands;
            brands.forEach(brand => {
                const option = document.createElement('option');
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);
            });
        }
    } catch (error) {
        console.error('Error loading camera brands:', error);
        // Fallback to common brands
        cameraBrands = ['Canon', 'Nikon', 'Sony', 'Panasonic', 'Fujifilm', 'Olympus', 'Pentax'];
        const brandSelect = document.getElementById('brand-filter');
        cameraBrands.forEach(brand => {
            const option = document.createElement('option');
            option.value = brand;
            option.textContent = brand;
            brandSelect.appendChild(option);
        });
    }
    
    // Load sensor types
    const sensorSelect = document.getElementById('sensor-filter');
    sensorTypes.forEach(sensor => {
        const option = document.createElement('option');
        option.value = sensor;
        option.textContent = sensor;
        sensorSelect.appendChild(option);
    });
}

// Update model filter when brand changes
async function onBrandFilterChange() {
    const brand = document.getElementById('brand-filter').value;
    const modelSelect = document.getElementById('model-filter');
    
    // Reset model filter
    modelSelect.innerHTML = '<option value="">All Models</option>';
    
    if (!brand) return;
    
    try {
        const response = await fetch('/api/camera-models?brand=' + encodeURIComponent(brand));
        const models = await response.json();
        
        if (models && models.length > 0) {
            cameraModels = models;
            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });
        }
    } catch (error) {
        console.error('Error loading camera models:', error);
    }
}

// Load camera listings
function computeCameraDealBadges(item) {
    let dealBadge = '';
    const isNewListing = item.is_new === true;

    // NEW: server-side flag based on latest import date for camera category
    if (isNewListing) {
        dealBadge += `<span class="badge" style="background: #3b82f6; color: white; font-weight: bold;" title="New listing from current import!">🆕 NEW</span><br>`;
    }

    // STEAL: requires price_stats and ≥15% below model average. Suppressed for NEW listings.
    if (!isNewListing && item.price_stats && item.price_stats.below_avg) {
        const avgPrice = parseFloat(item.price_stats.avg);
        const currentPrice = item.price_eur;
        const savingsPct = ((avgPrice - currentPrice) / avgPrice * 100);
        if (savingsPct >= 15) {
            dealBadge += `<span class="badge" style="background: #dc2626; color: white; font-weight: bold;" title="Price is ${savingsPct.toFixed(0)}% below average!">🔥 STEAL</span><br>`;
        }
    }

    return dealBadge;
}

async function loadCameras() {
    const activeOnly = document.getElementById('active-only').checked;
    const sortBy = document.getElementById('sort-by').value;
    const sortOrder = document.getElementById('sort-order').value;
    const brandFilter = document.getElementById('brand-filter').value;
    const modelFilter = document.getElementById('model-filter').value;
    const sensorFilter = document.getElementById('sensor-filter').value;
    
    const params = new URLSearchParams();
    params.append('active', activeOnly);
    params.append('sort', sortBy);
    params.append('order', sortOrder);
    if (brandFilter) params.append('brand', brandFilter);
    if (modelFilter) params.append('model', modelFilter);
    if (sensorFilter) params.append('sensor', sensorFilter);
    
    try {
        const response = await fetch('/api/cameras?' + params.toString());
        const data = await response.json();
        
        const container = document.getElementById('listings-container');
        
        if (!data.success || !data.listings || data.listings.length === 0) {
            container.innerHTML = '<div class="loading">No camera listings found</div>';
            return;
        }
        
        // Update stats
        document.getElementById('stat-total').textContent = data.stats?.total || data.listings.length;
        document.getElementById('stat-active').textContent = data.stats?.active || data.listings.filter(l => l.is_active).length;
        document.getElementById('stat-avg-price').textContent = '€' + (data.stats?.avg_price || 0).toFixed(0);
        document.getElementById('stat-with-lens').textContent = data.listings.filter(l => l.detected_lenses && l.detected_lenses.length > 0).length;
        
        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Title</th>
                        <th>{{ t('Price') }}</th>
                        <th>Camera</th>
                        <th>Sensor</th>
                        <th>Lenses</th>
                        <th>Location</th>
                        <th>Market Position</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.listings.forEach(item => {
            const dealBadge = computeCameraDealBadges(item);

            const imageHtml = item.image_url 
                ? `<img src="${item.image_url}" alt="Camera" class="listing-thumb" loading="lazy">`
                : '<div class="listing-thumb-placeholder">📸</div>';
            
            // Camera info badge
            let cameraInfo = '';
            if (item.camera_brand) {
                cameraInfo = `<span class="badge badge-success">${item.camera_brand}</span>`;
                if (item.camera_model) {
                    cameraInfo += `<br><small>${item.camera_model.substring(0, 30)}${item.camera_model.length > 30 ? '...' : ''}</small>`;
                }
            } else {
                cameraInfo = '<em style="color: #999;">Unknown</em>';
            }
            
            // Extract sensor type
            const sensorType = item.sensor_type || extractSensorType(item.title, item.camera_model);
            const sensorBadge = sensorType !== 'Unknown' 
                ? `<span class="badge" style="background: #3498db; color: white;">${sensorType}</span>`
                : `<span class="badge" style="background: #95a5a6;">Unknown</span>`;
            
            // Lenses count
            const lensesCount = item.detected_lenses ? item.detected_lenses.length : 0;
            const lensesBadge = lensesCount > 0 
                ? `<span class="badge" style="background: #e74c3c; color: white;">${lensesCount} lens${lensesCount > 1 ? 'es' : ''}</span>`
                : '';
            
            const safeListingId = item.listing_id ? item.listing_id.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
            const safeTitle = item.title ? item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
            
            html += `
                <tr class="clickable" onclick="showCameraDetail('${safeListingId}')">
                    <td class="listing-image-cell" style="position: relative;">
                        ${dealBadge ? `<div style="position: absolute; top: 4px; right: 4px; display: flex; flex-direction: column; gap: 4px; z-index: 10;">${dealBadge}</div>` : ''}
                        ${imageHtml}
                    </td>
                    <td style="max-width: 300px;">
                        <div style="font-weight: 600; margin-bottom: 0.25rem;">${item.title || 'Untitled'}</div>
                        <div style="font-size: 0.75rem; color: #888;">${item.listing_id || ''}</div>
                    </td>
                    <td><span class="price">€${item.price_eur}</span></td>
                    <td>${cameraInfo}</td>
                    <td>${sensorBadge}</td>
                    <td>${lensesBadge}</td>
                    <td>${item.seller_location || 'N/A'}</td>
                    <td style="text-align: center;">
                        ${item.is_unicorn ? `
                            <span style="background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; font-weight: bold; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; display: inline-block;" title="Only one listing of this camera model in all history!">🦄 UNICORN</span>
                        ` : (item.price_stats ? `
                            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                                Avg: €${item.price_stats.avg}<br>
                                Range: €${item.price_stats.min} - €${item.price_stats.max}
                            </div>
                            <div style="margin-top: 0.25rem; width: 100%; height: 6px; background: var(--bar-bg); border-radius: 3px; overflow: hidden;" title="Price percentile: ${item.price_stats.percentile}%">
                                <div style="height: 100%; background: linear-gradient(135deg, #667eea, #764ba2); width: ${item.price_stats.percentile}%;"></div>
                            </div>
                        ` : '<span style="font-size: 0.85rem; color: var(--text-secondary);">No price data</span>')}
                    </td>
                    <td>${item.date_posted ? new Date(item.date_posted).toLocaleDateString() : 'N/A'}</td>
                    <td>
                        <button class="btn btn-small" onclick="event.stopPropagation(); showCameraDetail('${safeListingId}')">View</button>
                        <button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); showCameraHistory('${safeListingId}')">History</button>
                        <button class="btn btn-small" style="background: #e74c3c;" onclick="event.stopPropagation(); showFlagModal('${safeListingId}', '${safeTitle}')">Flag</button>
                    </td>
                </tr>
            `;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error loading cameras:', error);
        document.getElementById('listings-container').innerHTML = 
            `<div class="error">Failed to load listings: ${error.message}</div>`;
    }
}

// Show camera detail popup — reworked to match the modern monitor/RAM popup design.
async function showCameraDetail(listingId) {
    try {
        // Reuse the shared listing modal that lives in base.html so the look is consistent.
        const modal = document.getElementById('shared-listing-modal');
        const content = document.getElementById('shared-listing-content');
        const title = document.getElementById('shared-listing-title');
        if (!modal) { alert('Shared modal missing'); return; }
        title.textContent = 'Loading…';
        content.innerHTML = '<div class="loading">Loading camera details…</div>';
        modal.classList.add('active');

        const escapeHtml = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        // Pull detail + price history in parallel
        const [detailsRes, history] = await Promise.all([
            fetch('/api/camera-listing-details/' + encodeURIComponent(listingId)).then(r => r.ok ? r.json() : null).catch(() => null),
            fetch('/api/price-history/' + encodeURIComponent(listingId)).then(r => r.ok ? r.json() : []).catch(() => []),
        ]);
        if (!detailsRes || detailsRes.error) {
            content.innerHTML = '<div class="error">' + (detailsRes?.error || 'Failed to load listing') + '</div>';
            return;
        }
        const listing = detailsRes.listing;
        if (!listing) { content.innerHTML = '<div class="error">Listing not found</div>'; return; }

        const cleanTitle = (raw) => {
            if (!raw) return '';
            return String(raw)
                .replace(/SS\.COM[^,]*,\s*Cena\s*\d+([.,]\d+)?\s*€\.?\s*/i, '')
                .replace(/SS\.COM[^,]*,\s*/i, '')
                .replace(/^\s+|\s+$/g, '');
        };
        const cleaned = cleanTitle(listing.title) || `${listing.camera_brand || ''} ${listing.camera_model || ''}`.trim() || 'Camera';
        title.textContent = cleaned;

        const imgPath = listing.local_image_path ? String(listing.local_image_path).replace(/\\/g, '/') : null;
        const imgUrl = imgPath ? `/images/${imgPath}` : listing.image_url;
        const price = parseFloat(listing.price_eur) || 0;
        const datePosted = listing.date_posted ? new Date(listing.date_posted).toLocaleDateString() : '—';

        // ---- Detected lenses ----
        const lenses = detailsRes.lenses || [];
        const detectedLensesHtml = lenses.length > 0 ? `
            <div class="ram-popup-stats" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                ${lenses.slice(0, 4).map(l => `
                    <div class="ram-stat-mini" style="background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(139,92,246,0.08)); border-color: rgba(99,102,241,0.2);">
                        <div class="ram-stat-mini-h">🔭 Detected Lens</div>
                        <div class="ram-stat-mini-v" style="font-size:0.95rem;">${escapeHtml(l.name || l.lens_name || 'Unknown')}</div>
                        ${l.brand ? `<div class="ram-stat-mini-m">${escapeHtml(l.brand)}</div>` : ''}
                        ${l.focal_length ? `<div class="ram-stat-mini-m">${escapeHtml(l.focal_length)}</div>` : ''}
                        ${l.mount_type ? `<div class="ram-stat-mini-m">Mount: ${escapeHtml(l.mount_type)}</div>` : ''}
                        ${l.aperture ? `<div class="ram-stat-mini-m">Aperture: ${escapeHtml(l.aperture)}</div>` : ''}
                        ${l.estimated_value ? `<div class="ram-stat-mini-d below">Est. value €${Number(l.estimated_value).toFixed(0)}</div>` : ''}
                    </div>
                `).join('')}
            </div>` : `
            <div class="ram-popup-empty">
                <div style="font-size:1.1rem;margin-bottom:0.25rem;">📷 Body only</div>
                No lens detected in title/description. ${listing.camera_mount ? `Compatible mount: <strong>${escapeHtml(listing.camera_mount)}</strong>.` : ''}
            </div>`;

        // ---- Camera reference spec grid ----
        const specRow = (k, v) => v ? `<div class="rp-spec"><span class="rp-spec-k">${escapeHtml(k)}</span><span class="rp-spec-v">${escapeHtml(String(v))}</span></div>` : '';
        const referenceHtml = `
            <div class="ram-popup-spec-grid">
                ${specRow('Brand', listing.camera_brand)}
                ${specRow('Model', listing.camera_model)}
                ${specRow('Mount', listing.camera_mount)}
                ${specRow('Sensor', listing.sensor_type || listing.megapixels)}
                ${specRow('Megapixels', listing.megapixels)}
                ${specRow('Year', listing.release_year)}
                ${specRow('FPS', listing.fps)}
                ${specRow('ISO', listing.iso)}
                ${specRow('Video', listing.video_specs)}
                ${specRow('Storage', listing.storage)}
                ${specRow('Battery', listing.battery)}
                ${specRow('Screen', listing.screen)}
            </div>`;

        // ---- Cost analysis (from existing endpoint) ----
        const cost = detailsRes.cost_breakdown;
        let costHtml = '';
        if (cost) {
            const savings = cost.savings_indication;
            const isGoodDeal = savings != null && savings > 0;
            const fmtEur = (n) => '€' + Number(n || 0).toFixed(0);
            const diffChipText = isGoodDeal
                ? '−€' + Math.abs(savings).toFixed(0) + ' below market value'
                : '+€' + Math.abs(savings).toFixed(0) + ' above market value';
            const diffChipClass = isGoodDeal ? 'below' : 'above';
            costHtml = `
                <div class="ram-popup-stats" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
                    <div class="ram-stat-mini"><div class="ram-stat-mini-h">📷 Camera value</div><div class="ram-stat-mini-v">${fmtEur(cost.camera_value)}</div></div>
                    <div class="ram-stat-mini"><div class="ram-stat-mini-h">🔭 Lens value</div><div class="ram-stat-mini-v">${fmtEur(cost.lenses_value)}</div></div>
                    <div class="ram-stat-mini"><div class="ram-stat-mini-h">📦 Market total</div><div class="ram-stat-mini-v">${fmtEur(cost.total_market_value)}</div></div>
                    <div class="ram-stat-mini"><div class="ram-stat-mini-h">💰 Listing</div><div class="ram-stat-mini-v">${fmtEur(cost.listing_price)}</div><div class="ram-stat-mini-d ${diffChipClass}">${escapeHtml(diffChipText)}</div></div>
                </div>
                <div style="margin-top:0.5rem;font-size:0.78rem;color:var(--ram-text-dim);">
                    ${isGoodDeal
                        ? '✅ <strong style="color:#16a34a;">Good deal</strong> — listing is below estimated market value.'
                        : '⚠️ <strong style="color:#ef4444;">Above market</strong> — listing is above the estimated market value.'}
                </div>`;
        } else {
            costHtml = '<div class="ram-popup-empty">No cost breakdown available for this listing.</div>';
        }

        // ---- Price history ----
        const fmtDate = (d) => {
            if (!d) return '—';
            const x = new Date(d);
            return isNaN(x.getTime()) ? '—' : x.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' });
        };
        const historyHtml = history && history.length > 0 ? `
            <div class="ram-popup-history">
                ${history.slice(0, 12).map(h => `
                    <div class="ram-popup-history-card current">
                        <div class="rh-price">€${Number(h.price_eur).toFixed(0)}</div>
                        <div class="rh-date">${fmtDate(h.recorded_at)}</div>
                    </div>
                `).join('')}
            </div>` : '<div class="ram-popup-empty">No price snapshots yet — this listing has only one recorded price.</div>';

        // ---- Render ----
        const html = `
            <div class="ram-popup-grid">
                <div class="ram-popup-left">
                    <div class="ram-popup-img" onclick="${imgUrl ? `window.open('${escapeHtml(imgUrl)}','_blank')` : ''}">
                        ${imgUrl
                            ? `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(cleaned)}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=font-size:64px>📷</div>'">`
                            : '<div style="font-size:64px;">📷</div>'}
                    </div>
                    <div class="ram-popup-price-block">
                        <div class="ram-popup-price">€${price.toFixed(0)}</div>
                        <div class="ram-popup-price-sub">${escapeHtml(listing.seller_location || '—')} · ${datePosted}</div>
                        ${cost && cost.savings_indication != null
                            ? (() => {
                                const s = cost.savings_indication;
                                if (s < 0) return `<div class="ram-popup-vs-avg"><span class="vs-avg below">−€${Math.abs(s).toFixed(0)} below market</span></div>`;
                                if (s > 0) return `<div class="ram-popup-vs-avg"><span class="vs-avg above">+€${Math.abs(s).toFixed(0)} above market</span></div>`;
                                return `<div class="ram-popup-vs-avg"><span class="vs-avg">= market value</span></div>`;
                            })()
                            : ''}
                    </div>
                </div>
                <div class="ram-popup-right">
                    <h3 class="ram-popup-h">📝 Listing</h3>
                    <div class="ram-popup-rows">
                        <div class="rp-row"><span class="rp-k">Title</span><span class="rp-v">${escapeHtml(cleaned)}</span></div>
                        ${(listing.title && listing.title !== cleaned) ? `<div class="rp-row" style="opacity:0.6;font-size:0.75rem;"><span class="rp-k">Raw</span><span class="rp-v">${escapeHtml(listing.title)}</span></div>` : ''}
                        <div class="rp-row"><span class="rp-k">Camera</span><span class="rp-v">${escapeHtml((listing.camera_brand || '') + ' ' + (listing.camera_model || ''))}</span></div>
                        <div class="rp-row"><span class="rp-k">Location</span><span class="rp-v">${escapeHtml(listing.seller_location || '—')}</span></div>
                        <div class="rp-row"><span class="rp-k">Posted</span><span class="rp-v">${datePosted}</span></div>
                        <div class="rp-row"><span class="rp-k">Status</span><span class="rp-v">${listing.is_active ? '🟢 Active' : '⚪ Inactive'}</span></div>
                    </div>
                    <div class="ram-popup-actions">
                        ${listing.listing_url ? `<a href="${escapeHtml(listing.listing_url)}" target="_blank" rel="noopener" class="ram-popup-btn primary">View on ss.com ↗</a>` : ''}
                        <button class="ram-popup-btn" onclick="showFlagSection('${escapeHtml(listing.listing_id)}')">🚩 Flag</button>
                    </div>
                </div>
            </div>

            <h3 class="ram-popup-h" style="margin-top:18px;">📷 Camera Reference</h3>
            ${referenceHtml}

            <h3 class="ram-popup-h" style="margin-top:18px;">🔭 Detected Lenses <span class="ram-popup-h-meta">${lenses.length} match${lenses.length === 1 ? '' : 'es'}</span></h3>
            ${detectedLensesHtml}

            <h3 class="ram-popup-h" style="margin-top:18px;">💰 Cost Analysis</h3>
            ${costHtml}

            <h3 class="ram-popup-h" style="margin-top:18px;">📈 Price History <span class="ram-popup-h-meta">${history.length} snapshot${history.length === 1 ? '' : 's'}</span></h3>
            ${historyHtml}

            ${listing.description ? `
                <h3 class="ram-popup-h" style="margin-top:18px;">📄 Description</h3>
                <div class="ram-popup-desc">${escapeHtml(listing.description)}</div>
            ` : ''}
        `;
        content.innerHTML = html;
    } catch (error) {
        console.error('Error loading camera details:', error);
        const content = document.getElementById('shared-listing-content');
        if (content) content.innerHTML = '<div class="error">Failed to load listing details: ' + error.message + '</div>';
    }
}

function closeCameraDetail() {
    const modal = document.getElementById('shared-listing-modal');
    if (modal) modal.classList.remove('active');
}

// Flag section functions
function showFlagSection(listingId) {
    const section = document.getElementById(`flag-section-${listingId}`);
    if (section) {
        section.style.display = 'block';
        section.classList.remove('collapsed');
        const textarea = document.getElementById(`flag-comment-${listingId}`);
        if (textarea) {
            textarea.focus();
            autoResizeTextarea(textarea);
        }
        updateToggleIcon(listingId);
    }
}

function hideFlagSection(listingId) {
    const section = document.getElementById(`flag-section-${listingId}`);
    if (section) {
        section.style.display = 'none';
        const textarea = document.getElementById(`flag-comment-${listingId}`);
        if (textarea) textarea.value = '';
    }
}

function toggleFlagSection(listingId) {
    const section = document.getElementById(`flag-section-${listingId}`);
    if (section) {
        section.classList.toggle('collapsed');
        updateToggleIcon(listingId);
        if (!section.classList.contains('collapsed')) {
            const textarea = document.getElementById(`flag-comment-${listingId}`);
            if (textarea) setTimeout(() => autoResizeTextarea(textarea), 0);
        }
    }
}

function updateToggleIcon(listingId) {
    const section = document.getElementById(`flag-section-${listingId}`);
    const icon = section ? section.querySelector('.flag-toggle-icon') : null;
    if (section && icon) {
        icon.textContent = section.classList.contains('collapsed') ? '▶' : '▼';
    }
}

function autoResizeTextarea(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
}

async function submitFlag(listingId) {
    const commentInput = document.getElementById(`flag-comment-${listingId}`);
    const comment = commentInput ? commentInput.value.trim() : '';
    
    if (!comment) {
        alert('Please enter a reason for flagging');
        return;
    }
    
    try {
        const response = await fetch('/api/flag-listing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                listing_id: listingId, 
                comment: comment,
                category: 'camera'
            })
        });
        
        const data = await response.json();
        if (data.success) {
            alert('Listing flagged successfully!');
            hideFlagSection(listingId);
        } else {
            alert('Error: ' + (data.error || 'Failed to flag listing'));
        }
    } catch (error) {
        console.error('Error flagging listing:', error);
        alert('Failed to flag listing. Please try again.');
    }
}

// Show flag modal (called from table row)
async function showFlagModal(listingId, title) {
    // Remove existing flag modal if present
    const existingModal = document.getElementById('flag-modal');
    if (existingModal) existingModal.remove();
    
    // Escape the listingId for use in the onclick attribute
    const safeId = listingId.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    
    const modalHtml = `
        <div id="flag-modal" class="modal-overlay active" style="z-index: 2000;">
            <div class="modal" style="max-width: 500px;">
                <div class="modal-header">
                    <h3>🚩 Flag Listing</h3>
                    <button class="modal-close" onclick="closeFlagModal()">&times;</button>
                </div>
                <div style="padding: 1.5rem;">
                    <p style="margin-bottom: 1rem;"><strong>Listing:</strong> ${title || listingId}</p>
                    
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Flag Category:</label>
                        <select id="flag-category" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px;">
                            <option value="IGNORE">IGNORE - Hide from listings</option>
                            <option value="SKIP">SKIP - Skip in future scrapes</option>
                            <option value="SCRAPPER">SCRAPPER - Scraper issue</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Reason:</label>
                        <textarea id="flag-reason" placeholder="Enter reason (e.g., Scam, Wrong specs, Sold)" 
                            style="width: 100%; padding: 0.75rem; border: 2px solid #e74c3c; border-radius: 8px; font-family: inherit; resize: vertical;"
                            rows="3"></textarea>
                    </div>
                    
                    <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                        <button class="btn btn-small btn-secondary" onclick="closeFlagModal()">{{ t('Cancel') }}</button>
                        <button class="btn btn-small" style="background: #e74c3c;" onclick="submitFlagFromModal('${safeId}')">Submit Flag</button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    // Close on outside click
    document.getElementById('flag-modal').addEventListener('click', function(e) {
        if (e.target === this) closeFlagModal();
    });
}

function closeFlagModal() {
    const modal = document.getElementById('flag-modal');
    if (modal) modal.remove();
}

function removeListingRow(listingId) {
    const rows = document.querySelectorAll('#listings-container tbody tr, table tbody tr');
    rows.forEach(row => {
        const onclick = row.getAttribute('onclick') || '';
        const html = row.innerHTML;
        if (onclick.includes("'" + listingId + "'") || html.includes("'" + listingId + "'") || html.includes(listingId)) {
            row.style.transition = 'opacity 0.3s ease';
            row.style.opacity = '0';
            setTimeout(() => row.remove(), 300);
        }
    });
}

async function submitFlagFromModal(listingId) {
    const categorySelect = document.getElementById('flag-category');
    const reasonInput = document.getElementById('flag-reason');
    
    const category = categorySelect ? categorySelect.value : 'IGNORE';
    const reason = reasonInput ? reasonInput.value.trim() : '';
    
    if (!reason) {
        alert('Please enter a reason for flagging');
        return;
    }
    
    try {
        const response = await fetch('/api/flag-listing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                listing_id: listingId, 
                comment: reason,
                category: 'camera',
                flag_category: category
            })
        });
        
        const data = await response.json();
        if (data.success) {
            alert('Listing flagged successfully!');
            closeFlagModal();
            // Refresh the listings
            loadCameras();
        } else {
            alert('Error: ' + (data.error || 'Failed to flag listing'));
        }
    } catch (error) {
        console.error('Error flagging listing:', error);
        alert('Failed to flag listing. Please try again.');
    }
}
