<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compare: 10 Computer Modal Patterns</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b1120; color: #e2e8f0;
  min-height: 100vh; padding: 24px 20px;
}
.wrap { max-width: 1600px; margin: 0 auto; }
.head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font-size: 24px; font-weight: 800; color: #f8fafc; }
.head p { color: #94a3b8; font-size: 13px; }
.head .links { margin-left: auto; display: flex; gap: 8px; }
.head a {
  padding: 6px 12px; background: #1e293b; color: #38bdf8; border: 1px solid #334155;
  border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600;
}
.head a:hover { background: #334155; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (min-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
.card {
  background: #1e293b; border: 1px solid #334155; border-radius: 10px;
  overflow: hidden;
}
.card-head {
  padding: 10px 14px; background: #0f172a; border-bottom: 1px solid #334155;
  display: flex; align-items: center; gap: 10px;
}
.card-head .v {
  background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a;
  font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 5px;
}
.card-head .name { font-size: 14px; font-weight: 700; color: #f8fafc; }
.card-head .open {
  margin-left: auto; font-size: 11px; color: #38bdf8; text-decoration: none;
  padding: 4px 10px; border: 1px solid #334155; border-radius: 5px;
}
.card-head .open:hover { background: #1e293b; }
.card img { display: block; width: 100%; height: auto; background: #0f172a; }
.card .pair { display: grid; grid-template-columns: 1fr 1fr; }
.card .pair > div { position: relative; }
.card .pair > div::before {
  content: attr(data-label); position: absolute; top: 6px; left: 6px; z-index: 2;
  background: rgba(15,23,42,.85); color: #38bdf8; font-size: 9.5px; font-weight: 700;
  padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .04em;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>🖥️ Computer Modal — 10 Reimaginings</h1>
      <p>Side-by-side comparison · left = list page, right = modal opened</p>
    </div>
    <div class="links">
      <a href="/computer-modals">↗ All versions</a>
      <a href="/computers">↗ Original /computers</a>
    </div>
  </div>

  <div class="grid">
    {% for vid, info in versions.items() %}
    <div class="card">
      <div class="card-head">
        <span class="v">v{{ vid }}</span>
        <span class="name">{{ info[0] }}</span>
        <a class="open" href="/computer-modal-v{{ vid }}">Open ↗</a>
      </div>
      <div class="pair">
        <div data-label="list"><img src="/modal-screens/v{{ vid }}_closed.png" alt="v{{ vid }} list"></div>
        <div data-label="modal"><img src="/modal-screens/v{{ vid }}_open.png" alt="v{{ vid }} modal"></div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>
