<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Computer Modal Reimaginings · SS-Crawler</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0f172a; color: #e2e8f0;
  min-height: 100vh; padding: 32px 20px;
}
.wrap { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; color: #f8fafc; }
.sub { font-size: 14px; color: #94a3b8; margin-bottom: 28px; }
.sub a { color: #38bdf8; text-decoration: none; }
.sub a:hover { text-decoration: underline; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.card {
  display: block; background: #1e293b; border: 1px solid #334155; border-radius: 12px;
  padding: 20px; transition: all .2s; text-decoration: none; color: inherit;
}
.card:hover { border-color: #38bdf8; transform: translateY(-2px); box-shadow: 0 12px 32px -8px rgba(56,189,248,.3); }
.card .num {
  display: inline-block; font-size: 11px; font-weight: 800;
  background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a;
  padding: 3px 8px; border-radius: 6px; margin-bottom: 10px;
}
.card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
.card p { font-size: 12.5px; color: #cbd5e1; line-height: 1.5; }
.card .arrow { font-size: 13px; color: #38bdf8; margin-top: 12px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖥️ Computer Modal Reimaginings</h1>
  <p class="sub">10 different patterns for the computer detail popup · Original <a href="/computers">/computers</a> page is untouched · Click any to try</p>
  <div class="grid">
    {% for vid, (name, tpl, desc) in versions.items() %}
    <a class="card" href="/computer-modal-v{{ vid }}">
      <span class="num">v{{ vid }}</span>
      <h3>{{ name }}</h3>
      <p>{{ desc }}</p>
      <span class="arrow">Try it →</span>
    </a>
    {% endfor %}
  </div>
</div>
</body>
</html>
