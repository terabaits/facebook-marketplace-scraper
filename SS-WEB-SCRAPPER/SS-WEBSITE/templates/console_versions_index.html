<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Console Page — 5 Reimaginings · SS-Crawler</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0a0a0f; color: #e4e4e7;
  min-height: 100vh; padding: 32px 20px;
}
.wrap { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 32px; font-weight: 800; margin-bottom: 6px; }
.sub { color: #a1a1aa; font-size: 14px; margin-bottom: 28px; }
.sub a { color: #38bdf8; text-decoration: none; }
.sub a:hover { text-decoration: underline; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.card {
  display: block; background: linear-gradient(135deg, #18181b, #1f1f25);
  border: 1px solid #27272a; border-radius: 14px; padding: 22px;
  transition: all .2s; text-decoration: none; color: inherit;
}
.card:hover { border-color: #38bdf8; transform: translateY(-2px); box-shadow: 0 14px 32px -10px rgba(56,189,248,.3); }
.card .num {
  display: inline-block; font-size: 11px; font-weight: 800;
  background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0a0a0a;
  padding: 3px 9px; border-radius: 5px; margin-bottom: 10px;
}
.card h3 { font-size: 19px; font-weight: 800; margin-bottom: 6px; color: #fafafa; }
.card p { font-size: 13px; color: #a1a1aa; line-height: 1.5; }
.card .arrow { font-size: 13px; color: #38bdf8; margin-top: 14px; display: inline-block; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Console Page — 5 Reimaginings</h1>
  <p class="sub">5 fundamentally different UX patterns for browsing console listings · Original <a href="/consoles">/consoles</a> is untouched</p>

  <div class="grid">
    {% for vid, (name, tpl, desc) in versions.items() %}
    <a class="card" href="/console-v{{ vid }}">
      <span class="num">v{{ vid }}</span>
      <h3>{{ name }}</h3>
      <p>{{ desc }}</p>
      <span class="arrow">Try it →</span>
    </a>
    {% endfor %}
  </div>
</div>
</body>
</html>
