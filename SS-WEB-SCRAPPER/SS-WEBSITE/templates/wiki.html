{% extends "base.html" %}

{% block title %}Project Wiki - SS-Crawler Dashboard{% endblock %}

{% block content %}
<style>
.wiki-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 2rem;
    align-items: start;
    width: 100%;
}
.wiki-layout > * {
    min-width: 0;
}
.wiki-sidebar {
    position: sticky;
    top: 1rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 1rem;
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
}
.wiki-sidebar h2 {
    font-size: 1rem;
    margin-top: 0;
    margin-bottom: 0.75rem;
}
.wiki-sidebar ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
    font-size: 0.85rem;
}
.wiki-sidebar li {
    margin-bottom: 0.35rem;
}
.wiki-sidebar a {
    color: var(--link-color, #667eea);
    text-decoration: none;
    display: block;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
}
.wiki-sidebar a:hover {
    background: var(--hover-bg, rgba(102,126,234,0.1));
    text-decoration: underline;
}
.wiki-sidebar ul ul {
    padding-left: 0.8rem;
    margin-top: 0.2rem;
}
.wiki-content {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 1.5rem;
    line-height: 1.7;
    min-width: 0;
}
.wiki-content h1 { font-size: 1.8rem; margin-top: 0; border-bottom: 2px solid var(--card-border); padding-bottom: 0.5rem; }
.wiki-content h2 { font-size: 1.4rem; margin-top: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.3rem; }
.wiki-content h3 { font-size: 1.15rem; margin-top: 1.5rem; }
.wiki-content a { color: var(--link-color, #4f46e5); text-decoration: none; }
.wiki-content a:hover { color: var(--link-hover-color, #4338ca); text-decoration: underline; }
.wiki-content code { background: var(--code-bg, #f5f5f5); color: var(--code-text, #333); padding: 0.15rem 0.35rem; border-radius: 4px; font-family: monospace; }
.wiki-content pre { background: var(--code-bg, #f5f5f5); color: var(--code-text, #333); padding: 1rem; border-radius: 8px; overflow-x: auto; border: 1px solid var(--card-border); }
.wiki-content pre code { background: transparent; color: inherit; padding: 0; }
.wiki-content table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
.wiki-content th, .wiki-content td { border: 1px solid var(--table-border, #ddd); padding: 0.5rem; text-align: left; }
.wiki-content th { background: var(--table-header-bg, #f0f0f0); }
@media (max-width: 900px) {
    .wiki-layout { grid-template-columns: 1fr; }
    .wiki-sidebar { position: static; max-height: none; }
}
</style>

<div class="wiki-layout">
    <aside class="wiki-sidebar">
        <h2>📑 Sections</h2>
        {{ toc_html | safe }}
        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--card-border);">
            <a href="{{ url_for('static', filename='../docs/project_wiki.md') }}" class="btn btn-small" download style="width: 100%; text-align: center;">⬇ Download .md</a>
        </div>
    </aside>
    <article class="wiki-content">
        {{ wiki_html | safe }}
    </article>
</div>
{% endblock %}
